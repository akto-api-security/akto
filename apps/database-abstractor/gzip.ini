# ---------------------------------------
# Module: gzip  (server-wide gzip — response compression + request inflation)
#
# Jetty 12 replacement for the old gzip config from web.xml (GzipFilter) and
# WEB-INF/jetty-web.xml (GzipHandler). Restores the *effective* old behaviour, which was
# governed by the GzipHandler (it had NO mime restriction) — so response compression covers
# all non-precompressed types, INCLUDING application/json. Edit here to tune; full option
# list is in jetty-home/modules/gzip.mod.
#
# NOTE on paths: the old GzipHandler set includedPaths=/* (all paths). In Jetty 12 that maps
# to a String[] setter that can't take a plain ini value, and "all paths" is the default when
# unset — so it's intentionally omitted (same behaviour, /* = default).
# ---------------------------------------
--modules=gzip

## Decompress incoming gzip-compressed REQUEST bodies (0 = disabled).
## Old jetty-web.xml GzipHandler had inflateBufferSize=1024, so clients may send
## Content-Encoding: gzip request bodies (e.g. large bulk-write payloads). Keep it on.
jetty.gzip.inflateBufferSize=1024

## HTTP methods whose RESPONSES may be compressed. Old GzipHandler: GET, POST, OPTIONS.
jetty.gzip.includedMethodList=GET,POST,OPTIONS

## MIME types to compress (explicit allow-list). Setting this switches gzip from the default
## deny-list ("compress all except pre-compressed") to an allow-list ("compress ONLY these").
## application/json is FIRST and required — db-abstractor is a JSON API, and the old effective
## behaviour (GzipHandler with no restriction) compressed JSON. The rest mirror the old GzipFilter
## list. Anything not listed here is NOT compressed, so add types if you serve others.
jetty.gzip.includedMimeTypeList=application/json,text/html,text/plain,text/xml,application/xhtml+xml,text/css,application/javascript,image/svg+xml
