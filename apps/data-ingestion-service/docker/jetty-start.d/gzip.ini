# ---------------------------------------
# Module: gzip  (server-wide response compression)
#
# Jetty 12 control file replacing the removed web.xml GzipFilter. mimeTypes below is an exact
# match of the old filter's <init-param> list (web.xml) - not expanded, to keep compression
# behavior identical to before this migration.
# ---------------------------------------
--modules=gzip

jetty.gzip.includedMimeTypeList=text/html,text/plain,text/xml,application/xhtml+xml,text/css,application/javascript,image/svg+xml
