# ---------------------------------------
# Module: gzip  (server-wide response compression)
#
# Jetty 12 control file replacing the old web.xml GzipFilter (mimeTypes) and
# jetty-web.xml GzipHandler (includedMethods/includedPaths). Edit here to tune compression;
# full option list is in jetty-home/modules/gzip.mod.
# ---------------------------------------
--modules=gzip

## HTTP methods whose RESPONSES may be compressed. Old GzipHandler: GET, POST, OPTIONS.
jetty.gzip.includedMethodList=GET,POST,OPTIONS

## MIME types to compress. Restored from the old GzipFilter list (which already included
## application/json). This is an ALLOW-LIST: only these types compress.
##   - text/javascript is ADDED because Jetty 12 serves .js as text/javascript (Jetty 9 used
##     application/javascript); without it the SPA's JS bundles would stop being compressed.
##   - To instead compress ALL non-precompressed types (simplest for a multi-asset SPA), leave
##     this property EMPTY — Jetty then compresses everything except already-compressed formats.
jetty.gzip.includedMimeTypeList=text/html,text/plain,text/xml,application/xhtml+xml,text/css,application/javascript,text/javascript,image/svg+xml,application/json

## includedPaths: old GzipHandler used /* (all paths), which is the default when unset. The
## Jetty 12 module maps this to a String[] setter that can't take a plain ini value, so it's
## intentionally omitted (same behaviour, /* = default).

## Request inflation (decompress incoming gzip REQUEST bodies). The dashboard's old config did
## NOT set this, and browser/SPA clients don't gzip request bodies, so it's left at the default
## (off). Uncomment if a client ever sends Content-Encoding: gzip requests.
# jetty.gzip.inflateBufferSize=1024
