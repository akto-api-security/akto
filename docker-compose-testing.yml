version: '3.8'
services:
  akto-api-security-testing:
    image: public.ecr.aws/aktosecurity/akto-api-security-mini-testing:latest
    environment:
      RUNTIME_MODE: hybrid
      DATABASE_ABSTRACTOR_SERVICE_TOKEN: "<token>"
      PUPPETEER_REPLAY_SERVICE_URL: "http://akto-puppeteer-replay:3000"
      AKTO_TESTING_TARGET_READ_TIMEOUT_SECONDS: "${AKTO_TESTING_TARGET_READ_TIMEOUT_SECONDS:-180}"
      MINI_TESTING_TASK_TIMEOUT_SECONDS: "${MINI_TESTING_TASK_TIMEOUT_SECONDS:-600}"
      MAX_POLL_INTERVAL_MS: "${MAX_POLL_INTERVAL_MS:-660000}"
    restart: always

  akto-api-security-puppeteer-replay:
    image: public.ecr.aws/aktosecurity/akto-puppeteer-replay:latest
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    restart: always

  watchtower:
    image: containrrr/watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_CLEANUP: true
      WATCHTOWER_POLL_INTERVAL: 1800
    labels:
      com.centurylinklabs.watchtower.enable: "false"
